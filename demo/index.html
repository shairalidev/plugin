<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinemepic Player Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/cinemepic-player.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #141620, #07080d 65%);
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      main {
        width: min(1100px, 100%);
      }

      h1 {
        font-size: 2.25rem;
        margin-bottom: 18px;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        text-align: center;
      }

      .player-grid {
        display: grid;
        gap: 48px;
      }

      .player-grid section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .player-grid h2 {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
      }

      .player-wrapper {
        position: relative;
      }

      .player-wrapper::after {
        content: '';
        position: absolute;
        inset: -30px;
        background: radial-gradient(circle at center, rgba(212, 175, 55, 0.25), transparent 70%);
        z-index: -1;
        filter: blur(10px);
      }

      .player-wrapper[data-theme='light']::after {
        background: radial-gradient(circle at center, rgba(255, 79, 112, 0.25), transparent 70%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cinemepic Player</h1>
      <div class="player-grid">
        <section>
          <h2>Classic layout</h2>
          <div class="player-wrapper">
            <div id="primary-player"></div>
          </div>
        </section>
        <section>
          <h2>Light theme, minimal layout</h2>
          <div class="player-wrapper" data-theme="light">
            <div id="secondary-player"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="../src/cinemepic-player.js"></script>
    <script>
      const playlist = [
        {
          title: 'Voyage Beyond the Stars',
          description: 'A slow pan through a neon-lit metropolis floating above the clouds.',
          duration: '02:15',
          src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
          poster: 'https://images.unsplash.com/photo-1526318472351-bc6c3f35fdd1?auto=format&fit=crop&w=960&q=80',
          thumbnail: 'https://images.unsplash.com/photo-1526318472351-bc6c3f35fdd1?auto=format&fit=crop&w=320&q=60',
        },
        {
          title: 'Cinematic Drone Flyover',
          description: 'Sweeping drone footage over dramatic mountains and glacial lakes.',
          duration: '01:05',
          src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
          poster: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=960&q=80',
          thumbnail: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=320&q=60',
        },
        {
          title: 'Desert Time-lapse',
          description: 'Clouds streak across the sky as shadows roll across the desert.',
          duration: '03:32',
          src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
          poster: 'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=960&q=80',
          thumbnail: 'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=320&q=60',
        },
      ];

      const player = new CinemepicPlayer('#primary-player', {
        playlist,
        autoplay: false,
        floating: true,
        playlistTitle: 'Featured Trailers',
        theme: {
          primary: '#fcd34d',
          background: '#04040a',
          videoBackground: '#000',
          text: '#f5f5fa',
          muted: '#9090a0',
        },
      });

      const lightPlayer = new CinemepicPlayer('#secondary-player', {
        playlist,
        layout: 'minimal',
        theme: {
          preset: 'light',
          primary: '#ff4f70',
          background: '#ffffff',
          text: '#1c1c21',
          muted: '#737382',
        },
      });

      // Example: respond to playlist changes
      lightPlayer.options.onVideoChange = ({ item }) => {
        console.log('Now playing:', item.title);
      };
    </script>
  </body>
</html>
