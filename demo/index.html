<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinemepic hero player demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/cinemepic-player.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #121625 0%, #05060f 48%, #010208 100%);
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(32px, 6vw, 72px);
      }

      main {
        width: min(1280px, 100%);
        display: grid;
        gap: clamp(32px, 5vw, 64px);
      }

      header {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      header h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.76);
      }

      header p {
        margin: 0 auto;
        max-width: 620px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.6;
        font-size: clamp(1rem, 2vw, 1.15rem);
      }

      .player-wrapper {
        position: relative;
        border-radius: 40px;
        padding: clamp(20px, 3vw, 32px);
        background: linear-gradient(145deg, rgba(64, 87, 255, 0.18), rgba(13, 15, 35, 0.6));
        backdrop-filter: blur(26px);
        box-shadow: 0 48px 120px rgba(0, 0, 0, 0.45);
      }

      .player-wrapper::after {
        content: '';
        position: absolute;
        inset: 18px;
        border-radius: 34px;
        pointer-events: none;
        background: linear-gradient(140deg, rgba(46, 149, 255, 0.25), rgba(16, 12, 32, 0));
        mix-blend-mode: screen;
        opacity: 0.4;
      }

      .player-wrapper > div {
        position: relative;
        z-index: 2;
      }

      footer {
        text-align: center;
        font-size: 0.85rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
      }

      @media (max-width: 720px) {
        body {
          padding: clamp(18px, 5vw, 28px);
        }

        .player-wrapper {
          padding: clamp(12px, 4vw, 20px);
          border-radius: 30px;
        }

        .player-wrapper::after {
          inset: 12px;
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Cinemepic sequence</h1>
        <p>
          This demo rebuilds the Cinemepic hero player UI: a cinematic background, triangular play trigger, and numbered
          storytelling menu hugging the right edge.
        </p>
      </header>
      <div class="player-wrapper">
        <div id="hero-player"></div>
      </div>
      <footer>Scroll the numbered tabs to explore each scene.</footer>
    </main>

    <script src="../src/cinemepic-player.js"></script>
    <script>
      const playlist = [
        {
          title: 'Prelude',
          tagline: '01 Prelude',
          description: 'A sweeping opening shot introduces the brand with widescreen momentum.',
          stepLabel: 'Prelude',
          accent: '#2c9dff',
          nextLabel: 'Enter strategy',
          src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
          poster:
            'https://images.unsplash.com/photo-1526481280695-3c46917c5ffa?auto=format&fit=crop&w=1920&q=80',
        },
        {
          title: 'Blueprint',
          tagline: '02 Blueprint',
          description: 'Storyboards, mood boards, and narrative structure take shape.',
          stepLabel: 'Blueprint',
          accent: '#8f6cff',
          src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
          poster:
            'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1920&q=80',
        },
        {
          title: 'Launch',
          tagline: '03 Launch',
          description: 'Final renders debut with a burst of colour and motion graphics.',
          stepLabel: 'Launch',
          accent: '#36d6c1',
          src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
          poster:
            'https://images.unsplash.com/photo-1465145782865-09532f760e82?auto=format&fit=crop&w=1920&q=80',
        },
        {
          title: 'Campaigns',
          tagline: '04 Campaigns',
          description: 'Embed-ready playlist slide showing how iframe scenes are supported.',
          stepLabel: 'Campaigns',
          accent: '#ff7a59',
          embed: {
            src: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
            title: 'Campaign teaser',
            allow:
              'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share',
          },
        },
      ];

      const player = new CinemepicPlayer('#hero-player', {
        playlist,
        autoplay: false,
        muted: true,
        nextLabel: 'Next',
        theme: {
          accent: '#2f92ff',
          background: '#05060f',
          text: '#ffffff',
          mutedText: 'rgba(255, 255, 255, 0.68)',
          overlay:
            'linear-gradient(115deg, rgba(5, 7, 15, 0.92) 12%, rgba(6, 11, 23, 0.76) 42%, rgba(9, 14, 27, 0.3) 70%, rgba(14, 18, 30, 0))',
        },
        videoAttributes: {
          playsinline: true,
        },
      });

      player.options.onVideoChange = ({ item }) => {
        console.log('Now featuring:', item.title);
      };
    </script>
  </body>
</html>
